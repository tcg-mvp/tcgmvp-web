name: TCGMVP Market Pipeline Alerts

on:
  workflow_run:
    workflows:
      - TCGMVP Daily Market Pipeline
      - TCGMVP Weekly SoldComps Pipeline
    types:
      - completed

  workflow_dispatch:
    inputs:
      test_conclusion:
        description: "Simulated pipeline result"
        required: true
        default: "failure"
        type: choice
        options:
          - failure
          - success

      test_workflow_name:
        description: "Simulated workflow name"
        required: true
        default: "TCGMVP Daily Market Pipeline"
        type: choice
        options:
          - TCGMVP Daily Market Pipeline
          - TCGMVP Weekly SoldComps Pipeline

permissions:
  contents: read
  issues: write

jobs:
  pipeline-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Create, update, or close pipeline alert
        uses: actions/github-script@v7
        with:
          script: |
            const isManualTest =
              context.eventName === "workflow_dispatch";

            let workflowName;
            let conclusion;
            let runUrl;
            let runId;
            let branch;
            let createdAt;

            if (isManualTest) {
              workflowName =
                "${{ inputs.test_workflow_name }}";

              conclusion =
                "${{ inputs.test_conclusion }}";

              runUrl =
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

              runId =
                context.runId;

              branch =
                context.ref
                  ? context.ref.replace("refs/heads/", "")
                  : "manual-test";

              createdAt =
                new Date().toISOString();
            } else {
              workflowName =
                context.payload.workflow_run.name;

              conclusion =
                context.payload.workflow_run.conclusion;

              runUrl =
                context.payload.workflow_run.html_url;

              runId =
                context.payload.workflow_run.id;

              branch =
                context.payload.workflow_run.head_branch;

              createdAt =
                context.payload.workflow_run.created_at;
            }

            const title =
              `[Pipeline Alert] ${workflowName}`;

            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "pipeline-alert",
                description:
                  "Automated TCGMVP market pipeline alert",
                color: "B60205",
              });

              console.log(
                "Created pipeline-alert label."
              );
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              console.log(
                "pipeline-alert label already exists."
              );
            }

            const issues =
              await github.rest.issues.listForRepo({
                owner,
                repo,
                state: "open",
                labels: "pipeline-alert",
                per_page: 100,
              });

            const existingIssue =
              issues.data.find(
                issue => issue.title === title
              );

            if (conclusion === "success") {
              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number:
                    existingIssue.number,
                  body:
                    `✅ Pipeline recovered successfully.\n\n` +
                    `Workflow: **${workflowName}**\n` +
                    `Run ID: **${runId}**\n` +
                    `Branch: **${branch}**\n` +
                    `Run: ${runUrl}`,
                });

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number:
                    existingIssue.number,
                  state: "closed",
                });

                console.log(
                  `Closed recovered alert issue #${existingIssue.number}.`
                );
              } else {
                console.log(
                  `${workflowName} succeeded and no open alert exists.`
                );
              }

              return;
            }

            const body =
              `## TCGMVP Pipeline Failure\n\n` +
              `The scheduled market pipeline did not complete successfully.\n\n` +
              `**Workflow:** ${workflowName}\n` +
              `**Conclusion:** ${conclusion}\n` +
              `**Run ID:** ${runId}\n` +
              `**Branch:** ${branch}\n` +
              `**Started:** ${createdAt}\n` +
              `**Manual Test:** ${isManualTest ? "Yes" : "No"}\n\n` +
              `### Investigation\n\n` +
              `1. Open the failed GitHub Actions run.\n` +
              `2. Review the failed pipeline step.\n` +
              `3. Check Supabase \`pipeline_runs\`.\n` +
              `4. Check Supabase \`pipeline_run_steps\`.\n` +
              `5. Resolve the source or product failure before rerunning.\n\n` +
              `**Failed run:** ${runUrl}`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number:
                  existingIssue.number,
                body:
                  `🚨 Another pipeline failure occurred.\n\n` +
                  body,
              });

              console.log(
                `Updated existing alert issue #${existingIssue.number}.`
              );

              return;
            }

            const newIssue =
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [
                  "pipeline-alert"
                ],
              });

            console.log(
              `Created pipeline alert issue #${newIssue.data.number}.`
            );